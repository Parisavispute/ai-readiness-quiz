<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Readiness Score – Build Your First AI Project in 60 Minutes</title>
  <style>
    /* ──────────────────────────────────────────
       TOKENS & RESET
    ────────────────────────────────────────── */
    :root {
      --bg:        #f4f6fb;
      --surface:   #ffffff;
      --surface2:  #f0f2f8;
      --border:    #d8dce8;
      --text:      #1a1d2e;
      --muted:     #6b7280;
      --accent:    #4f46e5;
      --accent-h:  #4338ca;
      --accent2:   #7c3aed;
      --green:     #16a34a;
      --yellow:    #d97706;
      --red:       #dc2626;
      --radius:    14px;
      --shadow:    0 4px 24px rgba(79,70,229,.10);
      --trans:     .22s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #0f1117;
        --surface:  #1a1d2e;
        --surface2: #242840;
        --border:   #2e3256;
        --text:     #e8eaf6;
        --muted:    #9196b0;
        --shadow:   0 4px 24px rgba(0,0,0,.4);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 48px;
    }

    /* ──────────────────────────────────────────
       CARD SHELL
    ────────────────────────────────────────── */
    #app {
      width: 100%;
      max-width: 520px;
      padding: 0 12px;
    }
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 28px 24px 32px;
      animation: fadeIn .35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ──────────────────────────────────────────
       TYPOGRAPHY
    ────────────────────────────────────────── */
    h1 { font-size: clamp(1.45rem, 5vw, 1.85rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.2; }
    h2 { font-size: clamp(1.1rem, 4vw, 1.35rem); font-weight: 700; line-height: 1.3; }
    p  { line-height: 1.65; color: var(--muted); }
    small { font-size: .8rem; color: var(--muted); }

    /* ──────────────────────────────────────────
       BADGE / LOGO
    ────────────────────────────────────────── */
    .logo-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 99px;
      margin-bottom: 18px;
    }
    .logo-pill svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ──────────────────────────────────────────
       START SCREEN
    ────────────────────────────────────────── */
    .hero-icon  { font-size: 3.5rem; margin-bottom: 10px; display: block; text-align: center; }
    .start-title { text-align: center; margin-bottom: 10px; }
    .start-sub   { text-align: center; margin-bottom: 22px; }
    .feature-list {
      list-style: none;
      margin: 20px 0 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feature-list li { display: flex; align-items: flex-start; gap: 10px; font-size: .95rem; }
    .feature-list li .icon { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }

    /* ──────────────────────────────────────────
       PROGRESS BAR
    ────────────────────────────────────────── */
    .progress-wrap { margin-bottom: 22px; }
    .progress-meta { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 7px; }
    .progress-track { height: 7px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width .4s cubic-bezier(.4,0,.2,1); }

    /* ──────────────────────────────────────────
       QUESTION CARD
    ────────────────────────────────────────── */
    .q-label { font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
    .q-text  { margin-bottom: 20px; }
    .q-hint  { font-size: .82rem; color: var(--muted); margin-bottom: 16px; margin-top: -12px; }

    /* ──────────────────────────────────────────
       OPTIONS
    ────────────────────────────────────────── */
    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }

    .option-btn {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      cursor: pointer;
      font-size: .95rem;
      line-height: 1.45;
      color: var(--text);
      transition: border-color var(--trans), background var(--trans), transform var(--trans);
      min-height: 52px;
      width: 100%;
      text-align: left;
      font-family: inherit;
      -webkit-tap-highlight-color: transparent;
    }
    .option-btn:active { transform: scale(.985); }

    .opt-indicator {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 1px;
      transition: border-color var(--trans), background var(--trans);
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .option-btn.multi .opt-indicator { border-radius: 6px; }
    .opt-dot { display: none; }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(79,70,229,.09);
    }
    .option-btn.selected .opt-indicator {
      background: var(--accent);
      border-color: var(--accent);
    }
    .option-btn.selected .opt-dot {
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
    }
    .option-btn.multi.selected .opt-dot {
      width: auto;
      height: auto;
      border-radius: 0;
      font-size: .7rem;
      font-weight: 900;
      color: #fff;
      content: "✓";
    }
    .opt-text { flex: 1; }

    /* ──────────────────────────────────────────
       BUTTONS
    ────────────────────────────────────────── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: var(--radius);
      cursor: pointer;
      border: none;
      transition: background var(--trans), transform var(--trans), opacity var(--trans);
      min-height: 52px;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      white-space: nowrap;
      font-family: inherit;
      width: 100%;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary  { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn-secondary { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); }
    .btn-ghost     { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
    .btn-whatsapp  { background: #25d366; color: #fff; }
    .btn-copy      { background: var(--surface2); color: var(--text); border: 1.5px solid var(--border); font-size: .9rem; }
    .btn-copy.copied { background: rgba(22,163,74,.15); border-color: var(--green); color: var(--green); }

    /* ──────────────────────────────────────────
       RESULT PAGE
    ────────────────────────────────────────── */
    .result-header { text-align: center; margin-bottom: 24px; }
    .result-emoji  { font-size: 3rem; display: block; margin-bottom: 8px; }
    .result-level  { display: inline-block; font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 4px 14px; border-radius: 99px; margin-top: 6px; }
    .level-explorer  { background: rgba(220,38,38,.12);  color: var(--red);    }
    .level-learner   { background: rgba(217,119,6,.12);  color: var(--yellow); }
    .level-builder   { background: rgba(79,70,229,.12);  color: var(--accent); }
    .level-innovator { background: rgba(22,163,74,.12);  color: var(--green);  }

    .score-display { margin: 20px 0 8px; }
    .score-number  { font-size: clamp(2.6rem, 12vw, 3.8rem); font-weight: 900; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; line-height: 1; }
    .score-denom   { font-size: 1.2rem; font-weight: 500; color: var(--muted); }
    .score-label   { font-size: .9rem; color: var(--muted); margin-top: 4px; }

    .meter-wrap  { margin: 16px 0 20px; }
    .meter-track { height: 14px; background: var(--surface2); border-radius: 99px; overflow: hidden; border: 1px solid var(--border); position: relative; }
    .meter-fill  { height: 100%; border-radius: 99px; transition: width 1.1s cubic-bezier(.22,1,.36,1); position: relative; }
    .meter-fill::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,.25) 50%,transparent 100%); border-radius: 99px; }
    .meter-ticks { display: flex; justify-content: space-between; font-size: .68rem; color: var(--muted); margin-top: 5px; padding: 0 2px; }

    .hook-box {
      background: linear-gradient(135deg, rgba(79,70,229,.08), rgba(124,58,237,.08));
      border: 1px solid rgba(79,70,229,.2);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
      font-size: .95rem;
      line-height: 1.6;
      color: var(--text);
    }
    .hook-box strong { color: var(--accent); }

    .section-title { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    .gap-item { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--surface2); border-radius: 10px; border: 1px solid var(--border); margin-bottom: 8px; font-size: .9rem; line-height: 1.5; }
    .gap-icon { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }
    .gap-text { color: var(--text); }
    .gap-text strong { display: block; margin-bottom: 2px; }

    .project-box { background: var(--surface2); border: 1.5px dashed var(--accent); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; }
    .proj-label { font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
    .project-box h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .project-box p  { font-size: .88rem; }

    .blueprint-box { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 22px; position: relative; overflow: hidden; }
    .blueprint-box::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg,transparent,transparent 8px,rgba(79,70,229,.04) 8px,rgba(79,70,229,.04) 16px); }
    .blueprint-inner { position: relative; z-index: 1; }
    .blueprint-lock  { font-size: 2rem; display: block; text-align: center; margin-bottom: 8px; }
    .blueprint-title { font-size: .9rem; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .blur-lines { display: flex; flex-direction: column; gap: 6px; margin: 10px 0; }
    .blur-line  { height: 10px; background: var(--surface2); border-radius: 99px; filter: blur(2px); }
    .blur-line:nth-child(2) { width: 75%; }
    .blur-line:nth-child(3) { width: 55%; }
    .blueprint-cta { text-align: center; font-size: .8rem; color: var(--muted); }
    .blueprint-cta strong { color: var(--accent); }

    .action-stack { display: flex; flex-direction: column; gap: 10px; }
    .divider { height: 1px; background: var(--border); margin: 20px 0; }
    .footer { text-align: center; font-size: .75rem; color: var(--muted); margin-top: 20px; line-height: 1.7; }

    /* Utility */
    .text-center { text-align: center; }
    .mb4  { margin-bottom: 4px; }
    .mb8  { margin-bottom: 8px; }
    .mb12 { margin-bottom: 12px; }
    .mb16 { margin-bottom: 16px; }
    .mb20 { margin-bottom: 20px; }
    .mt8  { margin-top: 8px; }
    .mt16 { margin-top: 16px; }

    @media (min-width: 480px) { .card { padding: 36px 36px 40px; } }
  </style>
</head>
<body>
<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════════════════════ */
var REGISTER_URL = "https://forms.gle/6VUcsZTPgtVFaHqs9";

/* ═══════════════════════════════════════════════════════════════

═══════════════════════════════════════════════════════════════ */

      { text: "🙈  I barely use them — not sure where to start",           value: "a0",  score: 0  },
      { text: "💬  I chat with them for homework help or essay drafts",    value: "a7",  score: 7  },

    ],
  },
  {
    id: "tech", label: "Tech Stack",
    text: "Tick every technology you have actually used — not just heard of.",
    type: "multi", scored: true, scoreKey: "tech",
    hint: "Select all that apply",
    options: [
      { text: "🐍  Python (any project)",               value: "python",  score: 3 },
      { text: "🔀  Git & GitHub",                        value: "git",     score: 3 },
      { text: "🔢  Pandas / NumPy",                      value: "pandas",  score: 3 },
      { text: "🧠  scikit-learn / TensorFlow / PyTorch", value: "sklearn", score: 3 },
      { text: "🔑  OpenAI / Claude / Gemini API",        value: "llmapi",  score: 3 },
      { text: "🚫  None of the above",                   value: "none",    score: 0, exclusive: true },
    ],
  },
  {
    id: "hours", label: "Your Time",
    text: "Realistically, how many hours per week can you commit to learning AI skills?",
    type: "single", scored: true, scoreKey: "hours",
    options: [
      { text: "⏱️  Less than 2 hours — pretty packed schedule", value: "h3",  score: 3  },
      { text: "📅  2–4 hours — a few sessions a week",           value: "h7",  score: 7  },
      { text: "🔥  5–8 hours — I make dedicated time for it",    value: "h11", score: 11 },
      { text: "⚡  8+ hours — I'm all in",                       value: "h15", score: 15 },
    ],
  },
];

var TOTAL = QUESTIONS.length;

var PROJECT_IDEAS = {
  cs:   { title: "AI-Powered Code Reviewer",          desc: "Paste any function; your app uses an LLM API to flag bugs, suggest improvements, and explain the logic — perfect for portfolios and placements." },

var YEAR_HOOKS = {
  "1":  "As a <strong>1st-year student</strong> you have the biggest advantage of all: time. Starting AI now puts you years ahead — most of your peers won't even think about this until placement season.",
  "2":  "You're in the <strong>sweet spot</strong>. 2nd year is when skills compound fastest. Build one solid AI project now and every internship application next year looks completely different.",

  { key: "python",   threshold: 15, icon: "🐍", title: "Python Confidence",     text: "You're not yet comfortable reading or writing Python. In the workshop you'll write your first AI script — no prior code experience needed." },
  { key: "projects", threshold: 9,  icon: "📂", title: "Portfolio Gap",          text: "You don't have a project to show yet. That's exactly what the workshop fixes — you'll walk away with a shareable GitHub repo." },

  { key: "hours",    threshold: 8,  icon: "⏰", title: "Dedicated Learning Time", text: "Under 5 hrs/week makes self-study painfully slow. Our workshop is a focused 60-minute burst — more progress than weeks of YouTube." },
];

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
var state = { screen: "start", current: 0, answers: {}, scores: {} };

/* ═══════════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════════ */
function totalScore() {
  return Object.values(state.scores).reduce(function(a, b) { return a + b; }, 0);
}
function getLevel(pct) {
  if (pct < 25) return { label: "Explorer",  cls: "level-explorer",  emoji: "🌱" };
  if (pct < 50) return { label: "Learner",   cls: "level-learner",   emoji: "📚" };
  if (pct < 75) return { label: "Builder",   cls: "level-builder",   emoji: "🛠️" };
  return               { label: "Innovator", cls: "level-innovator", emoji: "🚀" };
}
function computeGaps() {
  return GAPS.filter(function(g) { return (state.scores[g.key] || 0) < g.threshold; }).slice(0, 3);
}
function escAttr(str) {
  return String(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ═══════════════════════════════════════════════════════════════
   RENDER
═══════════════════════════════════════════════════════════════ */
var app = document.getElementById("app");

function render() {
  if (state.screen === "start")    renderStart();
  else if (state.screen === "question") renderQuestion();
  else if (state.screen === "result")   renderResult();
}

/* ── START ─────────────────────────────────────────────────── */
function renderStart() {
  app.innerHTML = [
    '<div class="card">',
      '<div class="text-center">',

          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">',

            '<path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>',

        '</div>',
      '</div>',
      '<span class="hero-icon">🧠</span>',
      '<h1 class="start-title">AI Readiness Score</h1>',
      '<p class="start-sub">Discover where you stand — and get a personalised plan to build your first AI project.</p>',
      '<ul class="feature-list">',
        '<li><span class="icon">⏱️</span><span>Takes about <strong>3 minutes</strong> — 8 quick questions</span></li>',
        '<li><span class="icon">📊</span><span>Get a score out of 105 with a <strong>personalised breakdown</strong></span></li>',
        '<li><span class="icon">🎁</span><span>Unlock a <strong>free workshop invite</strong>: Build Your First AI Project in 60 Minutes</span></li>',
        '<li><span class="icon">🔒</span><span>No login needed — <strong>100% free</strong></span></li>',
      '</ul>',
      '<button class="btn btn-primary" data-action="start">Check My AI Readiness &nbsp;→</button>',
      '<p class="text-center mt8"><small>Used by 500+ engineering students</small></p>',
    '</div>',
    '<div class="footer">',
      '"Build Your First AI Project in 60 Minutes" · Free Workshop<br>',
      '© ' + new Date().getFullYear() + ' · Scores are calculated locally — your data never leaves your device.',
    '</div>',
  ].join('');
}

/* ── QUESTION ──────────────────────────────────────────────── */
function renderQuestion() {
  var q   = QUESTIONS[state.current];
  var ans = state.answers[q.id];
  var pct = Math.round((state.current / TOTAL) * 100);

  var optionsHTML = q.options.map(function(opt) {
    var selected = false;
    if (q.type === "multi") {
      selected = Array.isArray(ans) && ans.indexOf(opt.value) !== -1;
    } else {
      selected = ans === opt.value;
    }
    var excl = opt.exclusive ? "true" : "false";
    return [
      '<button',
        ' class="option-btn ' + (q.type === "multi" ? "multi" : "") + (selected ? " selected" : "") + '"',
        ' data-action="select"',
        ' data-qid="' + escAttr(q.id) + '"',
        ' data-value="' + escAttr(opt.value) + '"',
        ' data-exclusive="' + excl + '"',
      '>',
        '<span class="opt-indicator"><span class="opt-dot">' + (q.type === "multi" && selected ? "✓" : "") + '</span></span>',
        '<span class="opt-text">' + opt.text + '</span>',
      '</button>',
    ].join('');
  }).join('');

  var hasAnswer = q.type === "multi"
    ? (Array.isArray(ans) && ans.length > 0)
    : (ans !== undefined && ans !== null);

  var isLast = state.current === TOTAL - 1;

  var backBtn = state.current > 0
    ? '<button class="btn btn-secondary mt8" data-action="prev">← Back</button>'
    : '';

  app.innerHTML = [
    '<div class="card">',
      '<div class="progress-wrap">',
        '<div class="progress-meta">',
          '<span>Question ' + (state.current + 1) + ' of ' + TOTAL + '</span>',
          '<span>' + pct + '% done</span>',
        '</div>',
        '<div class="progress-track">',
          '<div class="progress-fill" style="width:' + pct + '%"></div>',
        '</div>',
      '</div>',
      '<div class="q-label">' + q.label + '</div>',
      '<h2 class="q-text">' + q.text + '</h2>',
      (q.hint ? '<p class="q-hint">' + q.hint + '</p>' : ''),
      '<div class="options">' + optionsHTML + '</div>',
      '<button class="btn btn-primary" data-action="next"' + (hasAnswer ? '' : ' disabled') + '>',
        isLast ? 'See My AI Score 🎯' : 'Next →',
      '</button>',
      backBtn,
    '</div>',
    '<div class="footer">Question ' + (state.current + 1) + ' of ' + TOTAL + '</div>',
  ].join('');
}

/* ── RESULT ────────────────────────────────────────────────── */
function renderResult() {
  var score  = totalScore();
  var max    = 105;
  var pct    = Math.round((score / max) * 100);
  var level  = getLevel(pct);
  var gaps   = computeGaps();
  var year   = state.answers["year"]   || "1";
  var branch = state.answers["branch"] || "cs";
  var hook   = YEAR_HOOKS[year] || YEAR_HOOKS["1"];
  var idea   = PROJECT_IDEAS[branch] || PROJECT_IDEAS["cs"];

  var meterColor = pct < 25
    ? "linear-gradient(90deg,#dc2626,#ef4444)"
    : pct < 50
      ? "linear-gradient(90deg,#d97706,#f59e0b)"

        ? "linear-gradient(90deg,#4f46e5,#7c3aed)"

  var gapsHTML = gaps.length === 0
    ? '<p style="color:var(--green);font-weight:600;font-size:.95rem">🎉 No major gaps found — you are well prepared!</p>'
    : gaps.map(function(g) {
        return [
          '<div class="gap-item">',

        ].join('');
      }).join('');

  var shareMsg = '🤖 I just took the AI Readiness Quiz and scored ' + score + '/105 (' + pct + '%) — ' + level.label + ' level!\n\nWant to know yours? Register for the FREE "Build Your First AI Project in 60 Minutes" workshop: ' + REGISTER_URL;
  var waLink   = 'https://wa.me/?text=' + encodeURIComponent(shareMsg);

  app.innerHTML = [
    '<div class="card">',
      '<div class="result-header">',
        '<span class="result-emoji">' + level.emoji + '</span>',
        '<h1>Your AI Readiness Score</h1>',
        '<span class="result-level ' + level.cls + '">' + level.label + '</span>',
      '</div>',
      '<div class="score-display text-center">',
        '<div>',
          '<span class="score-number">' + score + '</span>',
          '<span class="score-denom">/ ' + max + '</span>',
        '</div>',
        '<div class="score-label">' + pct + '% · ' + level.label + '</div>',
      '</div>',
      '<div class="meter-wrap">',
        '<div class="meter-track">',
          '<div class="meter-fill" id="meterFill" style="width:0%;background:' + meterColor + '"></div>',
        '</div>',
        '<div class="meter-ticks">',
          '<span>0%</span><span>Explorer</span><span>Learner</span><span>Builder</span><span>Innovator</span>',
        '</div>',
      '</div>',
      '<div class="hook-box">' + hook + '</div>',
      (gaps.length > 0 ? '<div class="section-title">📍 Your skill gaps to close</div>' : ''),
      '<div class="mb16">' + gapsHTML + '</div>',
      '<div class="divider"></div>',
      '<div class="section-title">💡 Project idea matched to your branch</div>',
      '<div class="project-box mb20">',
        '<div class="proj-label">Suggested first project</div>',
        '<h3>' + idea.title + '</h3>',
        '<p>' + idea.desc + '</p>',
      '</div>',
      '<div class="blueprint-box mb20">',
        '<div class="blueprint-inner">',
          '<span class="blueprint-lock">🔒</span>',
          '<div class="blueprint-title">Your Personalised AI Project Blueprint</div>',
          '<p style="text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:8px">Step-by-step build plan · GitHub repo template · API key setup guide</p>',
          '<div class="blur-lines"><div class="blur-line"></div><div class="blur-line"></div><div class="blur-line"></div></div>',
          '<p class="blueprint-cta"><strong>Register below</strong> to unlock your blueprint + live walkthrough</p>',
        '</div>',
      '</div>',
      '<div class="action-stack">',
        '<a href="' + REGISTER_URL + '" target="_blank" rel="noopener" class="btn btn-primary">🎓 Register for the Free Workshop</a>',
        '<a href="' + waLink + '" target="_blank" rel="noopener" class="btn btn-whatsapp">',
          '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M11.999 2C6.476 2 2 6.477 2 12c0 1.99.563 3.845 1.535 5.42L2 22l4.703-1.523A9.96 9.96 0 0 0 12 22c5.523 0 10-4.478 10-10S17.522 2 11.999 2zm.001 18.184a8.183 8.183 0 0 1-4.17-1.142l-.299-.177-3.097 1.001.983-3.025-.195-.31A8.186 8.186 0 0 1 3.816 12c0-4.51 3.674-8.184 8.184-8.184 4.51 0 8.184 3.674 8.184 8.184 0 4.51-3.673 8.184-8.184 8.184z"/></svg>',
          ' Share on WhatsApp',
        '</a>',
        '<button class="btn btn-copy" id="copyBtn" data-action="copy" data-score="' + score + '" data-pct="' + pct + '" data-level="' + escAttr(level.label) + '">📋 Copy Result to Clipboard</button>',
        '<button class="btn btn-ghost" data-action="retake">🔄 Retake Quiz</button>',
      '</div>',
    '</div>',
    '<div class="footer">Scores are calculated locally in your browser.<br>Your data is never stored or sent anywhere.</div>',
  ].join('');

  requestAnimationFrame(function() {
    setTimeout(function() {
      var fill = document.getElementById("meterFill");
      if (fill) fill.style.width = pct + "%";
    }, 80);
  });
}

/* ═══════════════════════════════════════════════════════════════
   LOGIC
═══════════════════════════════════════════════════════════════ */
function doSelect(qId, value, exclusive) {
  var q = null;
  for (var i = 0; i < QUESTIONS.length; i++) {
    if (QUESTIONS[i].id === qId) { q = QUESTIONS[i]; break; }
  }
  if (!q) return;

  if (q.type === "multi") {
    var sel = Array.isArray(state.answers[qId]) ? state.answers[qId].slice() : [];
    if (exclusive) {
      sel = sel.indexOf(value) !== -1 ? [] : ["none"];
    } else {
      var noneIdx = sel.indexOf("none");
      if (noneIdx !== -1) sel.splice(noneIdx, 1);
      var idx = sel.indexOf(value);
      if (idx !== -1) sel.splice(idx, 1);
      else sel.push(value);
    }
    state.answers[qId] = sel;
    if (q.scored) {
      var pts = Math.min(sel.filter(function(v) { return v !== "none"; }).length * 3, 15);
      state.scores[q.scoreKey] = pts;
    }
  } else {
    state.answers[qId] = value;
    if (q.scored) {
      var found = null;
      for (var j = 0; j < q.options.length; j++) {
        if (q.options[j].value === value) { found = q.options[j]; break; }
      }
      state.scores[q.scoreKey] = found ? found.score : 0;
    }
  }
  renderQuestion();
}

function doNext() {
  var q   = QUESTIONS[state.current];
  var ans = state.answers[q.id];
  var has = q.type === "multi"
    ? (Array.isArray(ans) && ans.length > 0)
    : (ans !== undefined && ans !== null);
  if (!has) return;

  if (state.current < TOTAL - 1) {
    state.current++;
  } else {
    state.screen = "result";
  }
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function doPrev() {
  if (state.current > 0) {
    state.current--;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function doCopy(score, pct, levelLabel) {
  var text = '🤖 AI Readiness Score: ' + score + '/105 (' + pct + '%) — ' + levelLabel + '\n\n"Build Your First AI Project in 60 Minutes" — Free Workshop\nRegister: ' + REGISTER_URL;
  var btn = document.getElementById("copyBtn");

  function markCopied() {
    if (btn) {
      btn.classList.add("copied");
      btn.textContent = "✅ Copied!";
      setTimeout(function() {
        btn.classList.remove("copied");
        btn.textContent = "📋 Copy Result to Clipboard";
      }, 2200);
    }
  }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(markCopied).catch(function() { fallbackCopy(text, markCopied); });
  } else {
    fallbackCopy(text, markCopied);
  }
}

function fallbackCopy(text, cb) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;";
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(ta);
  if (cb) cb();
}

/* ═══════════════════════════════════════════════════════════════
   EVENT DELEGATION — single listener, no inline handlers
═══════════════════════════════════════════════════════════════ */
document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;

  var action = el.getAttribute("data-action");

  if (action === "start") {
    state.screen  = "question";
    state.current = 0;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  else if (action === "select") {
    var qid   = el.getAttribute("data-qid");
    var val   = el.getAttribute("data-value");
    var excl  = el.getAttribute("data-exclusive") === "true";
    doSelect(qid, val, excl);
  }
  else if (action === "next")   { doNext(); }
  else if (action === "prev")   { doPrev(); }
  else if (action === "retake") {
    state = { screen: "start", current: 0, answers: {}, scores: {} };
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
  else if (action === "copy") {
    var sc  = parseInt(el.getAttribute("data-score"), 10);
    var pc  = parseInt(el.getAttribute("data-pct"),   10);
    var lv  = el.getAttribute("data-level");
    doCopy(sc, pc, lv);
  }
});

/* ═══════════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════════ */
render();
</script>
