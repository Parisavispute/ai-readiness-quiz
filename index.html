<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Readiness Score – Build Your First AI Project in 60 Minutes</title>
  <style>
    /* ──────────────────────────────────────────
       TOKENS & RESET
    ────────────────────────────────────────── */
    :root {
      --bg:        #f4f6fb;
      --surface:   #ffffff;
      --surface2:  #f0f2f8;
      --border:    #d8dce8;
      --text:      #1a1d2e;
      --muted:     #6b7280;
      --accent:    #4f46e5;
      --accent-h:  #4338ca;
      --accent2:   #7c3aed;
      --green:     #16a34a;
      --yellow:    #d97706;
      --red:       #dc2626;
      --radius:    14px;
      --shadow:    0 4px 24px rgba(79,70,229,.10);
      --trans:     .22s ease;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:       #0f1117;
        --surface:  #1a1d2e;
        --surface2: #242840;
        --border:   #2e3256;
        --text:     #e8eaf6;
        --muted:    #9196b0;
        --shadow:   0 4px 24px rgba(0,0,0,.4);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0 48px;
    }

    /* ──────────────────────────────────────────
       CARD SHELL
    ────────────────────────────────────────── */
    #app {
      width: 100%;
      max-width: 520px;
      padding: 0 12px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 28px 24px 32px;
      animation: fadeIn .35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ──────────────────────────────────────────
       TYPOGRAPHY
    ────────────────────────────────────────── */
    h1 {
      font-size: clamp(1.45rem, 5vw, 1.85rem);
      font-weight: 800;
      letter-spacing: -.02em;
      line-height: 1.2;
    }
    h2 {
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      font-weight: 700;
      line-height: 1.3;
    }
    p  { line-height: 1.65; color: var(--muted); }
    small { font-size: .8rem; color: var(--muted); }

    /* ──────────────────────────────────────────
       GRADIENT BADGE / LOGO
    ────────────────────────────────────────── */
    .logo-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 99px;
      margin-bottom: 18px;
    }
    .logo-pill svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ──────────────────────────────────────────
       START SCREEN
    ────────────────────────────────────────── */
    .hero-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
      display: block;
      text-align: center;
    }
    .start-title { text-align: center; margin-bottom: 10px; }
    .start-sub   { text-align: center; margin-bottom: 22px; }

    .feature-list {
      list-style: none;
      margin: 20px 0 28px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .feature-list li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: .95rem;
    }
    .feature-list li .icon {
      font-size: 1.15rem;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ──────────────────────────────────────────
       PROGRESS BAR
    ────────────────────────────────────────── */
    .progress-wrap {
      margin-bottom: 22px;
    }
    .progress-meta {
      display: flex;
      justify-content: space-between;
      font-size: .8rem;
      color: var(--muted);
      margin-bottom: 7px;
    }
    .progress-track {
      height: 7px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    /* ──────────────────────────────────────────
       QUESTION CARD
    ────────────────────────────────────────── */
    .q-label {
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .q-text {
      margin-bottom: 20px;
    }
    .q-hint {
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 16px;
      margin-top: -12px;
    }

    /* ──────────────────────────────────────────
       OPTIONS (single & multi)
    ────────────────────────────────────────── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    .option-btn {
      all: unset;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 13px 16px;
      cursor: pointer;
      font-size: .95rem;
      line-height: 1.45;
      color: var(--text);
      transition: border-color var(--trans), background var(--trans), transform var(--trans);
      min-height: 52px;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
    }
    .option-btn:active { transform: scale(.985); }

    .option-btn .opt-indicator {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--border);
      flex-shrink: 0;
      margin-top: 1px;
      transition: border-color var(--trans), background var(--trans);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .option-btn.multi .opt-indicator { border-radius: 6px; }

    .option-btn.selected {
      border-color: var(--accent);
      background: rgba(79,70,229,.09);
    }
    .option-btn.selected .opt-indicator {
      background: var(--accent);
      border-color: var(--accent);
    }
    .option-btn.selected .opt-indicator::after {
      content: '';
      display: block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
    }
    .option-btn.multi.selected .opt-indicator::after {
      content: '✓';
      font-size: .7rem;
      font-weight: 900;
      color: #fff;
      border-radius: 0;
      width: auto;
      height: auto;
    }

    .opt-text { flex: 1; }

    /* ──────────────────────────────────────────
       BUTTONS
    ────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 24px;
      border-radius: var(--radius);
      cursor: pointer;
      border: none;
      transition: background var(--trans), transform var(--trans), opacity var(--trans);
      min-height: 52px;
      -webkit-tap-highlight-color: transparent;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      width: 100%;
    }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1.5px solid var(--border);
      width: 100%;
    }
    .btn-ghost {
      background: transparent;
      color: var(--accent);
      border: 1.5px solid var(--accent);
      width: 100%;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #fff;
      width: 100%;
    }
    .btn-copy {
      background: var(--surface2);
      color: var(--text);
      border: 1.5px solid var(--border);
      width: 100%;
      font-size: .9rem;
    }
    .btn-copy.copied {
      background: rgba(22,163,74,.15);
      border-color: var(--green);
      color: var(--green);
    }

    /* ──────────────────────────────────────────
       RESULT PAGE
    ────────────────────────────────────────── */
    .result-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .result-emoji {
      font-size: 3rem;
      display: block;
      margin-bottom: 8px;
    }
    .result-level {
      display: inline-block;
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 4px 14px;
      border-radius: 99px;
      margin-top: 6px;
    }
    .level-explorer  { background: rgba(220,38,38,.12);  color: var(--red);    }
    .level-learner   { background: rgba(217,119,6,.12);  color: var(--yellow); }
    .level-builder   { background: rgba(79,70,229,.12);  color: var(--accent); }
    .level-innovator { background: rgba(22,163,74,.12);  color: var(--green);  }

    .score-display {
      margin: 20px 0 8px;
    }
    .score-number {
      font-size: clamp(2.6rem, 12vw, 3.8rem);
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    .score-denom {
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--muted);
    }
    .score-label {
      font-size: .9rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Score meter */
    .meter-wrap {
      margin: 16px 0 20px;
    }
    .meter-track {
      height: 14px;
      background: var(--surface2);
      border-radius: 99px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }
    .meter-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1.1s cubic-bezier(.22,1,.36,1);
      position: relative;
    }
    .meter-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,.25) 50%,transparent 100%);
      border-radius: 99px;
    }
    .meter-ticks {
      display: flex;
      justify-content: space-between;
      font-size: .68rem;
      color: var(--muted);
      margin-top: 5px;
      padding: 0 2px;
    }

    /* Hook / year message */
    .hook-box {
      background: linear-gradient(135deg, rgba(79,70,229,.08), rgba(124,58,237,.08));
      border: 1px solid rgba(79,70,229,.2);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
      font-size: .95rem;
      line-height: 1.6;
      color: var(--text);
    }
    .hook-box strong { color: var(--accent); }

    /* Gaps */
    .section-title {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .gap-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      background: var(--surface2);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 8px;
      font-size: .9rem;
      line-height: 1.5;
    }
    .gap-item .gap-icon { font-size: 1.15rem; flex-shrink: 0; margin-top: 1px; }
    .gap-item .gap-text { color: var(--text); }
    .gap-item .gap-text strong { display: block; margin-bottom: 2px; }

    /* Project idea */
    .project-box {
      background: var(--surface2);
      border: 1.5px dashed var(--accent);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 18px;
    }
    .project-box .proj-label {
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .project-box h3 {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .project-box p { font-size: .88rem; }

    /* Blueprint teaser */
    .blueprint-box {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 22px;
      position: relative;
      overflow: hidden;
    }
    .blueprint-box::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -45deg,
        transparent,
        transparent 8px,
        rgba(79,70,229,.04) 8px,
        rgba(79,70,229,.04) 16px
      );
    }
    .blueprint-inner { position: relative; z-index: 1; }
    .blueprint-lock {
      font-size: 2rem;
      display: block;
      text-align: center;
      margin-bottom: 8px;
    }
    .blueprint-title {
      font-size: .9rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 6px;
    }
    .blur-lines {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 10px 0;
    }
    .blur-line {
      height: 10px;
      background: var(--surface2);
      border-radius: 99px;
      filter: blur(2px);
    }
    .blur-line:nth-child(2) { width: 75%; }
    .blur-line:nth-child(3) { width: 55%; }
    .blueprint-cta {
      text-align: center;
      font-size: .8rem;
      color: var(--muted);
    }
    .blueprint-cta strong { color: var(--accent); }

    /* Action buttons row */
    .action-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ──────────────────────────────────────────
       DIVIDER
    ────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ──────────────────────────────────────────
       FOOTER
    ────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-size: .75rem;
      color: var(--muted);
      margin-top: 20px;
      line-height: 1.7;
    }

    /* ──────────────────────────────────────────
       UTILITY
    ────────────────────────────────────────── */
    .hidden { display: none !important; }
    .text-center { text-align: center; }
    .mb4  { margin-bottom: 4px; }
    .mb8  { margin-bottom: 8px; }
    .mb12 { margin-bottom: 12px; }
    .mb16 { margin-bottom: 16px; }
    .mb20 { margin-bottom: 20px; }
    .mt8  { margin-top: 8px; }
    .mt16 { margin-top: 16px; }

    /* ──────────────────────────────────────────
       RESPONSIVE TWEAKS
    ────────────────────────────────────────── */
    @media (min-width: 480px) {
      .card { padding: 36px 36px 40px; }
    }
  </style>
</head>

<div id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   CONFIG — change this one constant to your real Google Form URL
═══════════════════════════════════════════════════════════════ */

/* ═══════════════════════════════════════════════════════════════
   QUESTIONS

═══════════════════════════════════════════════════════════════ */

    key: "python",
    threshold: 15,
    icon: "🐍",

    text: "You're not yet comfortable reading or writing Python. In the workshop you'll write your first AI script — no prior code experience needed."

/* ═══════════════════════════════════════════════════════════════
   LEVEL THRESHOLDS (percentage)
═══════════════════════════════════════════════════════════════ */
function getLevel(pct) {
  if (pct < 25) return { label: "Explorer",  cls: "level-explorer",  emoji: "🌱" };
  if (pct < 50) return { label: "Learner",   cls: "level-learner",   emoji: "📚" };
  if (pct < 75) return { label: "Builder",   cls: "level-builder",   emoji: "🛠️" };
  return          { label: "Innovator", cls: "level-innovator", emoji: "🚀" };
}

/* ═══════════════════════════════════════════════════════════════
   STATE
═══════════════════════════════════════════════════════════════ */
let state = {
  screen: "start",   // start | question | result
  current: 0,
  answers: {},       // { questionId: value | value[] }
  scores: {},        // { python, projects, aiuse, tech, hours }

/* ═══════════════════════════════════════════════════════════════
   HELPERS
═══════════════════════════════════════════════════════════════ */
function totalScore() {
  return Object.values(state.scores).reduce((a, b) => a + b, 0);
}

function computeGaps() {
  return GAPS.filter(g => (state.scores[g.key] || 0) < g.threshold).slice(0, 3);
}

function shareText(score, pct, level) {
  return `🤖 I just took the AI Readiness Quiz and scored ${score}/105 (${pct}%) — ${level.label} level!\n\nWant to find out your AI readiness score? 👇\nRegister for the FREE "Build Your First AI Project in 60 Minutes" workshop: ${REGISTER_URL}`;
}

/* ── QUESTION ──────────────────────────────────────────────── */
function renderQuestion() {
  const q   = QUESTIONS[state.current];
  const ans = state.answers[q.id];
  const pct = Math.round((state.current / TOTAL_QUESTIONS) * 100);

  const optionsHTML = q.options.map((opt, i) => {
    let selected = false;
    if (q.type === "multi") {
      selected = Array.isArray(ans) && ans.includes(opt.value);

    }
    return `

        class="option-btn ${q.type === "multi" ? "multi" : ""} ${selected ? "selected" : ""}"

      >

  app.innerHTML = `

}

/* ═══════════════════════════════════════════════════════════════
   EVENT HANDLERS
═══════════════════════════════════════════════════════════════ */
function startQuiz() {
  state.screen  = "question";
  state.current = 0;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function selectOption(qId, value, exclusive) {
  const q = QUESTIONS.find(q => q.id === qId);

  if (q.type === "multi") {
    let sel = Array.isArray(state.answers[qId]) ? [...state.answers[qId]] : [];

    if (exclusive) {
      // "None" selected — deselect everything else
      sel = sel.includes(value) ? [] : ["none"];
    } else {
      // Remove "none" if a real option is picked
      sel = sel.filter(v => v !== "none");
      if (sel.includes(value)) {
        sel = sel.filter(v => v !== value);
      } else {
        sel.push(value);
      }
    }
    state.answers[qId] = sel;

    // Score: 3 pts per non-exclusive pick, max 15
    if (q.scored) {
      const pts = Math.min(sel.filter(v => v !== "none").length * 3, 15);
      state.scores[q.scoreKey] = pts;
    }
  } else {
    state.answers[qId] = value;

    // Score: find option score
    if (q.scored) {
      const opt = q.options.find(o => String(o.value) === String(value));
      state.scores[q.scoreKey] = opt ? opt.score : 0;
    }
  }

  renderQuestion();
}

function nextQuestion() {
  const q   = QUESTIONS[state.current];
  const ans = state.answers[q.id];
  const has = q.type === "multi"
    ? Array.isArray(ans) && ans.length > 0
    : ans !== undefined;

  if (!has) return;

  if (state.current < TOTAL_QUESTIONS - 1) {
    state.current++;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  } else {
    state.screen = "result";
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function prevQuestion() {
  if (state.current > 0) {
    state.current--;
    render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }
}

function retake() {
  state = {
    screen: "start",
    current: 0,
    answers: {},
    scores: {},
  };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function copyResult(score, pct, levelLabel) {
  const text = `🤖 AI Readiness Score: ${score}/105 (${pct}%) — ${levelLabel}\n\n"Build Your First AI Project in 60 Minutes" — Free Workshop\nRegister: ${REGISTER_URL}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById("copyBtn");
    if (btn) {
      btn.classList.add("copied");
      btn.textContent = "✅ Copied!";
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = "📋 Copy Result to Clipboard";
      }, 2200);
    }
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity  = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    const btn = document.getElementById("copyBtn");
    if (btn) {
      btn.classList.add("copied");
      btn.textContent = "✅ Copied!";
      setTimeout(() => {
        btn.classList.remove("copied");
        btn.textContent = "📋 Copy Result to Clipboard";
      }, 2200);
    }
  });
}

/* ═══════════════════════════════════════════════════════════════
   INIT

render();
</script>
